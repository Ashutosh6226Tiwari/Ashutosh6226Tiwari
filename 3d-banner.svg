<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <radialGradient id="node-main" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#7e22ce" />
      <stop offset="80%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>

    <radialGradient id="node-cyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </radialGradient>
    
    <radialGradient id="node-magenta" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(20px) translateX(-10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg) scaleX(1); }
      50% { transform: rotate(180deg) scaleX(0.8); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @keyframes drift {
      from { transform: translateX(-100px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      to { transform: translateX(900px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .main-node { animation: float1 6s ease-in-out infinite; transform-origin: 650px 150px; }
    .cyan-node { animation: float2 8s ease-in-out infinite; transform-origin: 450px 80px; }
    .magenta-node { animation: float3 7s ease-in-out infinite; transform-origin: 750px 240px; }
    .particle { fill: #c084fc; opacity: 0; }
    .ring1 { animation: rotateRing 15s linear infinite; transform-origin: 650px 150px; }
    .ring2 { animation: rotateRing 20s linear infinite reverse; transform-origin: 650px 150px; }
    .glass-card { animation: float1 7s ease-in-out infinite reverse; transform-origin: center; }
    .glow-text { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Animated Particles (Data flow) -->
  <g>
    <circle cx="0" cy="50" r="2" class="particle" style="animation: drift 10s linear infinite 0s;" />
    <circle cx="0" cy="120" r="3" class="particle" style="animation: drift 15s linear infinite 2s;" />
    <circle cx="0" cy="180" r="1.5" class="particle" style="animation: drift 12s linear infinite 5s;" />
    <circle cx="0" cy="250" r="2.5" class="particle" style="animation: drift 8s linear infinite 1s;" />
    <circle cx="0" cy="90" r="2" class="particle" style="animation: drift 11s linear infinite 7s;" />
  </g>

  <!-- Animated 3D Objects -->
  
  <!-- Cyan Node (Top Left) -->
  <g class="cyan-node">
    <circle cx="450" cy="80" r="40" fill="url(#node-cyan)" filter="url(#glow)"/>
  </g>

  <!-- Magenta Node (Bottom Right) -->
  <g class="magenta-node">
    <circle cx="750" cy="240" r="50" fill="url(#node-magenta)" />
  </g>

  <!-- Main Purple Node (Center Right) -->
  <g class="main-node">
    <circle cx="650" cy="150" r="85" fill="url(#node-main)" />
    <!-- Rotating Rings around main node -->
    <ellipse cx="650" cy="150" rx="140" ry="40" fill="none" stroke="#a855f7" stroke-width="2" class="ring1" />
    <ellipse cx="650" cy="150" rx="160" ry="30" fill="none" stroke="#22d3ee" stroke-width="1.5" class="ring2" />
    <ellipse cx="650" cy="150" rx="120" ry="50" fill="none" stroke="#f472b6" stroke-width="1" class="ring1" style="animation-duration: 25s;" />
  </g>

  <!-- Glassmorphism Card (Floating) -->
  <g class="glass-card">
    <rect x="50" y="80" width="390" height="140" rx="20" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" filter="url(#glass)"/>
    
    <!-- Text Content -->
    <text x="75" y="145" font-family="'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">Ashutosh Tiwari</text>
    <text x="78" y="185" font-family="'Segoe UI', 'Inter', sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" letter-spacing="1">SOFTWARE ENGINEER <tspan fill="#a855f7">&amp;</tspan> DESIGNER</text>
    
    <!-- Pulsing Accent -->
    <circle cx="65" cy="180" r="4" fill="#a855f7" class="glow-text" filter="url(#glow)"/>
  </g>
</svg>
