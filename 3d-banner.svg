<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Radial Gradients for 3D Spheres -->
    <radialGradient id="sphere-cyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="20%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </radialGradient>

    <radialGradient id="sphere-purple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="20%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>
    
    <radialGradient id="sphere-emerald" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="20%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Wireframe Floor/Grid -->
  <g opacity="0.3" stroke="#3f3f46" stroke-width="1.5">
    <path d="M -200,200 L 1000,200" />
    <path d="M -300,230 L 1100,230" />
    <path d="M -400,270 L 1200,270" />
    <!-- Vertical lines angled for perspective -->
    <path d="M 400,180 L 400,300" />
    <path d="M 450,180 L 550,300" />
    <path d="M 500,180 L 700,300" />
    <path d="M 550,180 L 850,300" />
    <path d="M 600,180 L 1000,300" />
    
    <path d="M 350,180 L 250,300" />
    <path d="M 300,180 L 100,300" />
    <path d="M 250,180 L -50,300" />
    <path d="M 200,180 L -200,300" />
  </g>

  <!-- 3D Spheres -->
  <!-- Main Sphere -->
  <circle cx="650" cy="150" r="80" fill="url(#sphere-purple)" filter="url(#shadow)" />
  
  <!-- Small Cyan Sphere -->
  <circle cx="500" cy="80" r="40" fill="url(#sphere-cyan)" filter="url(#shadow)" />
  
  <!-- Medium Emerald Sphere -->
  <circle cx="750" cy="220" r="50" fill="url(#sphere-emerald)" filter="url(#shadow)" />

  <!-- Floating Rings around Main Sphere -->
  <ellipse cx="650" cy="150" rx="120" ry="30" fill="none" stroke="#d8b4fe" stroke-width="3" opacity="0.6" transform="rotate(-15 650 150)" />
  <ellipse cx="650" cy="150" rx="140" ry="40" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.4" transform="rotate(25 650 150)" />

  <!-- Text -->
  <g filter="url(#glow)">
    <text x="50" y="140" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="1">Ashutosh Tiwari</text>
  </g>
  <text x="52" y="190" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="500" fill="#a1a1aa" letter-spacing="0.5">Software Engineer &amp; Designer</text>

</svg>
